select_sell_orders: |
  SELECT *
  FROM order_book
  WHERE symbol = %s
    AND side = 'SELL'
    AND status IN ('PENDING', 'PARTIALLY_EXECUTED')
    AND remaining_quantity > 0
  ORDER BY price ASC, created_at ASC
  FOR UPDATE NOWAIT

select_buy_orders: |
  SELECT *
  FROM order_book
  WHERE symbol = %s
    AND side = 'BUY'
    AND status IN ('PENDING', 'PARTIALLY_EXECUTED')
    AND remaining_quantity > 0
  ORDER BY price DESC, created_at ASC
  FOR UPDATE NOWAIT
