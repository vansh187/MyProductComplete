get_wallet_balance: |
  SELECT user_id, balance
  FROM wallets
  WHERE user_id = %s

get_wallet_balance_for_update: |
  SELECT user_id, balance
  FROM wallets
  WHERE user_id = %s
  FOR UPDATE

update_wallet_balance: |
  UPDATE wallets
  SET balance = %s
  WHERE user_id = %s

increment_wallet_balance: |
  UPDATE wallets
  SET balance = COALESCE(balance, 0) + %s
  WHERE user_id = %s
