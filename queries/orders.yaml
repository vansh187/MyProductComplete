create_order: |
  INSERT INTO orders (user_id, symbol, side, quantity, price, status, exchange, order_type, product_type, validity, trigger_price, client_order_id, broker, source, token, lot_size, created_at, updated_at)
  VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, NOW(), NOW())
  RETURNING id

get_orders: |
  SELECT id, user_id, symbol, side, quantity, price, status, exchange, order_type, product_type, validity, trigger_price, client_order_id, broker_order_id, created_at, updated_at
  FROM orders
  WHERE user_id = %s
  ORDER BY created_at DESC

get_order_by_id: |
  SELECT id, user_id, symbol, side, quantity, price, status, exchange, order_type, product_type, validity, trigger_price, client_order_id, broker_order_id, created_at, updated_at
  FROM orders
  WHERE user_id = %s AND id = %s

get_order_snapshot_by_id: |
  SELECT symbol, broker, source, token, lot_size, product_type, exchange
  FROM orders
  WHERE id = %s

set_broker_order_id: |
  UPDATE orders
  SET broker_order_id = %s, updated_at = NOW()
  WHERE id = %s

get_order_by_broker_order_id: |
  SELECT id, user_id, symbol, side, quantity, price, status, exchange, order_type, product_type, validity, trigger_price, client_order_id, broker_order_id, lot_size, token, created_at, updated_at
  FROM orders
  WHERE broker_order_id = %s

get_order_by_id_only: |
  SELECT id, user_id, symbol, side, quantity, price, status, exchange, order_type, product_type, validity, trigger_price, client_order_id, broker_order_id, lot_size, token, created_at, updated_at
  FROM orders
  WHERE id = %s

insert_processed_broker_fill: |
  INSERT INTO processed_broker_fills (flid, order_id)
  VALUES (%s, %s)

cancel_order: |
  UPDATE orders
  SET status = %s
  WHERE user_id = %s AND id = %s AND status IN ('PENDING', 'PENDING_TRIGGER')
  RETURNING side, quantity, price, symbol, exchange

modify_order: |
  UPDATE orders
  SET price = COALESCE(%s, price),
      quantity = COALESCE(%s, quantity),
      trigger_price = COALESCE(%s, trigger_price),
      updated_at = NOW()
  WHERE user_id = %s AND id = %s AND status IN ('PENDING', 'PENDING_TRIGGER')
    AND price IS NOT DISTINCT FROM %s
    AND quantity IS NOT DISTINCT FROM %s
    AND trigger_price IS NOT DISTINCT FROM %s

update_order_status: |
  UPDATE orders
  SET status = %s
  WHERE id IN (%s, %s)

update_order_status_single: |
  UPDATE orders
  SET status = %s,
      avg_fill_price = %s,
      filled_qty = %s,
      trigger_price = COALESCE(%s, trigger_price),
      client_order_id = COALESCE(%s, client_order_id),
      updated_at = NOW()
  WHERE id = %s
