insert_wallet_ledger: |
  INSERT INTO wallet_ledger
    (user_id, razorpay_order_id, razorpay_payment_id, amount, currency,
     transaction_type, status, created_at)
  VALUES (CAST(%s AS VARCHAR), %s, NULL, %s, %s, %s, %s, NOW())

update_payment_status: |
  UPDATE wallet_ledger
  SET status = %s, razorpay_payment_id = %s
  WHERE user_id::integer = %s AND razorpay_order_id = %s AND status = %s

select_wallet_for_update: |
  SELECT
    w.wallet_id,
    COALESCE(w.balance, 0.00)::NUMERIC AS balance,
    CAST(wl.amount AS NUMERIC) AS transaction_amount,
    wl.status AS transaction_status
  FROM wallets w
  RIGHT JOIN wallet_ledger wl ON w.user_id = wl.user_id::integer
  WHERE wl.razorpay_order_id = %s AND wl.user_id::integer = %s
  ORDER BY wl.created_at DESC
  LIMIT 1

insert_wallet: |
  INSERT INTO wallets (user_id, balance)
  VALUES (%s, %s)

update_wallet_balance: |
  UPDATE wallets
  SET balance = %s
  WHERE user_id = %s

get_user_id_by_order: |
  SELECT user_id
  FROM wallet_ledger
  WHERE razorpay_order_id = %s
  LIMIT 1
