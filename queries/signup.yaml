insert_user: |
  INSERT INTO users (first_name, last_name, email, password, phone_number, created_at)
  VALUES (%s, %s, %s, %s, %s, NOW())

insert_google_user: |
  INSERT INTO users (first_name, last_name, email, password, phone_number, created_at)
  VALUES (%s, %s, %s, NULL, '', NOW())
  RETURNING user_id
