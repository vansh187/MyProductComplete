insert_trade_history: |
  INSERT INTO trade_history
    (user_id, symbol, side, quantity, execution_price, executed_at,
     buy_order_id, sell_order_id, buy_user_id, sell_user_id, trade_value)
  VALUES (%s, %s, %s, %s, %s, NOW(), %s, %s, %s, %s, %s)
  RETURNING id

get_trade_history_by_user: |
  SELECT id, user_id, symbol, quantity, execution_price, executed_at
  FROM trade_history
  WHERE user_id = %s
  ORDER BY executed_at DESC

get_fill_stats_by_order_id: |
  SELECT
    COALESCE(SUM(quantity * execution_price) / NULLIF(SUM(quantity), 0), 0) AS avg_fill_price,
    COALESCE(SUM(quantity), 0) AS filled_qty
  FROM trade_history
  WHERE buy_order_id = %s OR sell_order_id = %s
